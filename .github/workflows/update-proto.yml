name: Update WAProto

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install packages
        run: |
          yarn
          yarn --pure-lockfile --cwd proto-extract

      - name: Update WAProto.proto
        id: wa_proto_info
        run: |
          set -e

          echo "🔍 Running proto extractor..."
          yarn --cwd proto-extract start > wa-logs.txt || true

          WA_VERSION=$(grep -oP 'Current version:\s*\K.+' wa-logs.txt || true)
          WA_JS_URL=$(grep -oP 'Found source JS URL:\s*\K.+' wa-logs.txt || true)

          if [ -z "$WA_VERSION" ]; then
            echo "⚠️ WhatsApp version not found. Skipping update."
            exit 0
          fi

          echo "✅ Found WhatsApp version: $WA_VERSION"
          echo "wa_version=$WA_VERSION" >> $GITHUB_OUTPUT
          echo "wa_js_url=$WA_JS_URL" >> $GITHUB_OUTPUT

      - name: GenerateStatics
        run: yarn gen:protobuf

      - name: Update baileys-version.json
        run: |
          WA_VERSION="${{ steps.wa_proto_info.outputs.wa_version }}"

          if [ -z "$WA_VERSION" ]; then
            echo "⚠️ No version to write. Skipping."
            exit 0
          fi

          WA_NUMBERS=$(echo $WA_VERSION | sed "s/\./, /g")
          echo -e "{\n\t\"version\": [$WA_NUMBERS]\n}" > src/Defaults/baileys-version.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: updated proto/version to v${{ steps.wa_proto_info.outputs.wa_version }}"
          title: "Whatsapp v${{ steps.wa_proto_info.outputs.wa_version }} proto/version change"
          branch: "update-proto/stable"
          delete-branch: true
          labels: "update-proto"
          skip-if-no-changes: true
          body: |
            Automated changes
            Found source JS URL: ${{ steps.wa_proto_info.outputs.wa_js_url }}
            Current version: v${{ steps.wa_proto_info.outputs.wa_version }}
          add-paths: |
            WAProto/*
            src/Defaults/baileys-version.json
